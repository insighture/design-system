name: AI skill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Regenerates GUIDELINES.md, AGENTS.md, brand/ and the component index,
      # builds the zip, and fails if Tracelet would refuse it
      # (scripts/skill/tracelet-check.mjs).
      - run: npm run skill
      - name: Generated files are committed
        run: |
          if ! git diff --exit-code -- GUIDELINES.md AGENTS.md brand/ references/components.md; then
            echo "::error::Generated skill files are stale. Run npm run skill and commit the result."
            exit 1
          fi
      - name: GitHub's Download ZIP ships the same files
        run: |
          diff <(git archive HEAD | tar -t | grep -v '/$' | sort) \
               <(unzip -Z1 dist/insighture-design-system.zip | grep -v '/$' | sed 's|^insighture-design-system/||' | sort)
      - uses: actions/upload-artifact@v4
        with:
          name: insighture-design-system
          path: dist/insighture-design-system.zip
